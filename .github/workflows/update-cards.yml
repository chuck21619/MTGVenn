name: Update cards

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build card_tags.js
        run: python3 build_card_tags.py

      - name: Commit and publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add card_tags.js

          if git diff --cached --quiet; then
            echo "No card changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update card data"
          git push

          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
