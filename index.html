<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>MTG Deck Tag Analyzer</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #14161a;
            --surface: #1e2127;
            --border: #3a3f48;
            --text: #e4e6ea;
            --accent: #7fb2ff;
            --error: #ff8a80;
        }

        html {
            background: var(--bg);
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1400px;
            margin: auto;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            font-family: monospace;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 5px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px;
        }

        .section {
            margin-top: 30px;
        }

        summary {
            cursor: pointer;
        }

        summary h2 {
            display: inline;
        }

        .combo {
            margin-bottom: 10px;
            padding: 10px;
            background: var(--surface);
            border-radius: 5px;
        }

        #tagChoices {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin-bottom: 15px;
        }

        #upsetPlot {
            overflow-x: auto;
        }

        #forceGraph {
            margin-top: 10px;
        }

        #forceMinShared {
            width: 50px;
        }

        #forceCanvas {
            display: block;
        }

        .upset-band {
            fill: var(--surface);
        }

        .upset-label, .upset-count {
            fill: var(--text);
            font-size: 12px;
        }

        .upset-set, .upset-bar, .upset-dot-on {
            fill: var(--accent);
        }

        .upset-dot-off {
            fill: var(--border);
        }

        .upset-link {
            stroke: var(--accent);
            stroke-width: 3;
        }

        .upset-hit {
            fill: transparent;
            cursor: pointer;
        }

        .upset-hit:hover {
            fill: rgba(255, 255, 255, 0.08);
        }

        .loading {
            color: var(--accent);
        }

        .error {
            color: var(--error);
        }
    </style>
</head>
<body>

<h1 ondblclick="loadSampleDeck()">MTG Deck Tag Analyzer</h1>

<p>
Paste a deck export from Archidekt, Moxfield, TappedOut, or any plain text deck list.
</p>

<textarea
    id="deckList"
    rows="20"
    placeholder="1 Zetalpa, Primal Dawn
1 Akroma, Vision of Ixidor
1 Vampire Nighthawk">
</textarea>

<br>

<button onclick="analyzeDeck()">
    Analyze Deck
</button>

<div id="status"></div>

<div id="problems"></div>

<div class="section">
    <h2>Tags to Show</h2>
    <div id="tagChoices"></div>
</div>

<div class="section">
    <h2>UpSet Plot</h2>
    <div id="upsetPlot"></div>
    <div id="upsetCards"></div>
</div>

<div class="section">
    <h2>Force Graph</h2>
    <label>
        Connect cards sharing at least
        <input
            id="forceMinShared"
            type="number"
            min="1"
            value="2"
            onchange="renderForceGraph()">
        selected tags
    </label>
    <div id="forceGraph">
        <canvas id="forceCanvas" height="0"></canvas>
    </div>
    <div id="forceCards"></div>
</div>

<details class="section">
    <summary><h2>Tag Overlap Groups</h2></summary>
    <div id="overlaps"></div>
</details>

<details class="section">
    <summary><h2>Tag Counts</h2></summary>
    <div id="tagCounts"></div>
</details>

<script src="card_tags.js"></script>
<script src="sampleDeckList.js"></script>
<script src="app.js"></script>

</body>
</html>
