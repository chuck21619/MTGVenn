<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>MTG Deck Tag Analyzer</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #14161a;
            --surface: #1e2127;
            --border: #3a3f48;
            --text: #e4e6ea;
            --accent: #7fb2ff;
            --error: #ff8a80;
        }

        html {
            background: var(--bg);
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1400px;
            margin: auto;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            font-family: monospace;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 5px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px;
        }

        .section {
            margin-top: 30px;
        }

        summary {
            cursor: pointer;
        }

        summary h2 {
            display: inline;
        }

        .combo {
            margin-bottom: 10px;
            padding: 10px;
            background: var(--surface);
            border-radius: 5px;
        }

        #tagChoices {
            max-width: 420px;
            margin-bottom: 15px;
        }

        #tagChoices label {
            display: flex;
            gap: 8px;
            padding: 3px 6px;
            cursor: pointer;
        }

        #tagChoices label[hidden] {
            display: none;
        }

        #tagChoices label:hover {
            background: var(--surface);
        }

        .tag-count {
            margin-left: auto;
        }

        #tagControls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        #tagControls[hidden] {
            display: none;
        }

        #tagControls button {
            margin-top: 0;
        }

        #tagClearAll {
            margin-left: auto;
        }

        #tagSearch {
            padding: 9px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 5px;
        }

        #upsetPlot {
            overflow-x: auto;
        }

        #forceGraph {
            margin-top: 10px;
        }

        #forceMinShared {
            width: 50px;
        }

        #forceCanvas {
            display: block;
        }

        .upset-band {
            fill: var(--surface);
        }

        .upset-label, .upset-count {
            fill: var(--text);
            font-size: 12px;
        }

        .upset-set, .upset-bar, .upset-dot-on {
            fill: var(--accent);
        }

        .upset-dot-off {
            fill: var(--border);
        }

        .upset-link {
            stroke: var(--accent);
            stroke-width: 3;
        }

        .upset-hit {
            fill: transparent;
            cursor: pointer;
        }

        .upset-hit:hover {
            fill: rgba(255, 255, 255, 0.08);
        }

        #cardGrid {
            overflow-x: auto;
        }

        #cardGrid table {
            width: auto;
            border-collapse: separate;
            border-spacing: 0;
        }

        #cardGrid th {
            vertical-align: bottom;
        }

        .grid-tag {
            padding: 6px 4px;
            font-size: 12px;
            font-weight: normal;
        }

        .grid-tag span {
            display: inline-block;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
        }

        .grid-card {
            padding: 2px 8px;
            font-size: 12px;
            white-space: nowrap;
        }

        .grid-on, .grid-off {
            min-width: 18px;
            padding: 0;
        }

        .grid-on {
            background: var(--accent);
        }

        #tagCounts {
            overflow-x: auto;
        }

        .count-grid {
            stroke: var(--surface);
        }

        .count-text {
            fill: var(--text);
            font-size: 12px;
        }

        .count-hit {
            fill: transparent;
        }

        .count-bar {
            fill: var(--accent);
        }

        .count-column:hover .count-hit {
            fill: var(--surface);
        }

        #tagCardsTooltip {
            display: none;
            position: fixed;
            z-index: 1;
            max-width: 380px;
            padding: 10px;
            font-size: 13px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            pointer-events: none;
        }

        .loading {
            color: var(--accent);
        }

        .error {
            color: var(--error);
        }
    </style>
</head>
<body>

<h1 ondblclick="loadSampleDeck()">MTG Deck Tag Analyzer</h1>

<details open>
<summary><h2>Deck List</h2></summary>

<p>
Paste a deck export from Archidekt, Moxfield, TappedOut, or any plain text deck list.
</p>

<textarea
    id="deckList"
    rows="20"
    placeholder="1 Zetalpa, Primal Dawn
1 Akroma, Vision of Ixidor
1 Vampire Nighthawk">
</textarea>

</details>

<button onclick="analyzeDeck()">
    Analyze Deck
</button>

<div id="status"></div>

<div id="problems"></div>

<details id="tagsSection" class="section" open>
    <summary><h2>Tags to Show</h2></summary>
    <div id="tagControls" hidden>
        <input
            id="tagSearch"
            type="search"
            placeholder="Search tags"
            oninput="filterTagChoices()">
        <button id="tagShowAll" onclick="toggleAllTags()"></button>
        <span id="tagSummary"></span>
        <button id="tagClearAll" onclick="clearAllTags()">Clear all</button>
    </div>
    <div id="tagChoices"></div>
</details>

<details id="upsetSection" class="section" open>
    <summary><h2>UpSet Plot</h2></summary>
    <div id="upsetPlot"></div>
    <div id="upsetCards"></div>
</details>

<details id="forceSection" class="section" open ontoggle="if (this.open) renderForceGraph()">
    <summary><h2>Force Graph</h2></summary>
    <label>
        Connect cards sharing at least
        <input
            id="forceMinShared"
            type="number"
            min="1"
            value="2"
            onchange="renderForceGraph()">
        selected tags
    </label>
    <div id="forceGraph">
        <canvas id="forceCanvas" height="0"></canvas>
    </div>
    <div id="forceCards"></div>
</details>

<details id="gridSection" class="section" open>
    <summary><h2>Card Grid</h2></summary>
    <p>Rows are cards and columns are tags. Rows with few squares may not fit the deck.</p>
    <div id="cardGrid"></div>
</details>

<details id="overlapSection" class="section">
    <summary><h2>Tag Overlap Groups</h2></summary>
    <div id="overlaps"></div>
</details>

<details id="countsSection" class="section" open>
    <summary><h2>Tag Counts</h2></summary>
    <div id="tagCounts"></div>
</details>

<div id="tagCardsTooltip"></div>

<script src="card_tags.js"></script>
<script src="sampleDeckList.js"></script>
<script src="app.js"></script>

</body>
</html>
